[package]
name = "vizia"
description = "A declarative desktop GUI framework"
autoexamples = false
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
exclude = ["assets/", "examples/"]

[features]
default = ["winit", "clipboard", "x11", "wayland", "markdown", "accesskit"]
clipboard = ["vizia_core/clipboard", "vizia_winit?/clipboard"]
winit = ["vizia_winit"]
baseview = ["vizia_baseview"]
x11 = ["vizia_winit?/x11", "vizia_core/x11"]
wayland = ["vizia_winit?/wayland", "vizia_core/wayland"]
accesskit = ["vizia_winit?/accesskit"]
tray = ["vizia_winit?/tray"]
markdown = ["vizia_core/markdown"]
rayon = ["vizia_core/rayon"]
serde = ["vizia_core/serde"]
tokio = ["vizia_core/tokio", "dep:tokio"]
url-loader = ["vizia_core/url-loader"]
profiling = ["vizia_core/profiling"]

[dependencies]
vizia_core.workspace = true
vizia_winit = { workspace = true, optional = true, default-features = false}
vizia_baseview = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
chrono.workspace = true
log.workspace = true
fern.workspace = true
ego-tree.workspace = true
serde.workspace = true
serde_json = "1"

[workspace]
members = ["crates/*", "examples/todo", "examples/widget_gallery", "examples/gallery"]

[workspace.package]
version = "0.5.0"
authors = ["George Atkinson"]
edition = "2024"
license = "MIT"
repository = "https://github.com/vizia/vizia"
rust-version = "1.95"


[workspace.dependencies]
vizia = { version = "0.5.0", path = "." }
vizia_core = { version = "0.5.0", path = "crates/vizia_core", default-features = false }
vizia_winit = { version = "0.5.0", path = "crates/vizia_winit", default-features = false }
vizia_baseview = { version = "0.5.0", path = "crates/vizia_baseview" }
vizia_id = { version = "0.5.0", path = "crates/vizia_id" }
vizia_input = { version = "0.5.0", path = "crates/vizia_input" }
vizia_storage = { version = "0.5.0", path = "crates/vizia_storage" }
vizia_style = { version = "0.5.0", path = "crates/vizia_style" }
vizia_window = { version = "0.5.0", path = "crates/vizia_window" }
vizia_reactive = { version = "0.5.0", path = "crates/vizia_reactive" }
accesskit = "0.25"
accesskit_winit = "0.34"
baseview = { version = "0.4.2", features = ["opengl"] }
bitflags = "2.13.2"
chrono = "0.4"
comrak = { version = "0.59", default-features = false }
copypasta = { version = "0.10", default-features = false }
cssparser = "0.38"
cssparser-color = "0.6"
dashmap = { version = "6.2", features = ["inline"] }
fern = "0.7"
fluent-bundle = "0.16.0"
fluent-langneg = "0.14.2"
ego-tree = "0.11"
fxhash = "0.2"
gl-rs = { package = "gl", version = "0.14" }
glutin = { version = "0.32", default-features = false, features = ["egl", "wgl", "glx"] }
glutin-winit = { version = "0.5", default-features = false, features = ["egl", "wgl", "glx"] }
hashbrown = "0.17"
indexmap = "2.14"
keyboard-types = { version = "0.8", default-features = false }
log = "0.4"
morphorm = "0.9"
open = "5.4.5"
parking_lot = "0.13"
parley = { version = "0.11", features = ["accesskit"] }

raw-window-handle = "0.6"
rayon = "1.12"
reqwest = { version = "0.13.5" }
selectors = "0.43"
serde = { version = "1.0", features = ["derive"] }
skia-safe = { version = "0.157", features = ["gl", "textlayout", "svg"] }
sys-locale = "0.3"
tokio = { version = "1.54", features = ["rt-multi-thread", "time", "fs", "io-util"] }
tray-icon = "0.26"
gtk = "0.18"
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFRunLoop"] }

unic-langid = { version = "0.9.6", features = ["macros"] }
unicode-segmentation = "1.13"
unicode-bidi = "0.3"
windows-sys = { version = "0.61", default-features = false, features = ["Win32_Graphics_Dwm"] }
winit = { version = "0.30", default-features = false }

[target."cfg(target_os = \"macos\")".dependencies.skia-safe]
version = "0.157"
features = ["textlayout", "svg", "metal", "gl"]

[target."cfg(target_os = \"linux\")".dependencies.skia-safe]
version = "0.157"
features = ["textlayout", "svg", "x11", "wayland", "gl"]

[target."cfg(target_os = \"windows\")".dependencies.skia-safe]
version = "0.157"
features = ["textlayout", "svg", "d3d", "vulkan", "gl"]

[workspace.lints.rust]
# future_incompatible = "allow"
# let_underscore = "allow"
# nonstandard_style = "allow"
# rust_2018_compatibility = "allow"
# rust_2018_idioms = "allow"
# rust_2021_compatibility = "allow"
# unused = "allow"

[workspace.lints.clippy]
# cargo = "allow"
# pedantic = "allow"
# nursery = "allow"
# separated_literal_suffix = "allow"

